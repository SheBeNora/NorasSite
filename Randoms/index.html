<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noras website thing</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="../image/png" sizes="180x180" href="../images/favicons/apple-touch-icon.png">
  <link rel="icon" type="../image/png" sizes="32x32" href="../images/favicons/favicon-32x32.png">
  <link rel="icon" type="../image/png" sizes="16x16" href="../images/favicons/favicon-16x16.png">
  <link rel="manifest" href="../images/favicons/site.webmanifest">
</head>
<body class="Cover" style="background-image: url('../images/CameraPhotos/DSCF9825.JPG');">
  <main>
    <div class="audio-player">
      <audio id="audio" src="../sounds/Whisper.mp3" loop></audio>
      <button id="play-pause" class="play-btn" aria-label="Play"></button>
      <div class="timeline-container">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-slider" max="100" value="0">
        <span id="duration">0:00</span>
      </div>
      <div class="volume-container">
        <button id="mute-toggle" class="volume-btn" aria-label="Mute"></button>
        <input type="range" id="volume-slider" max="100" value="10">
      </div>
    </div>
    <p class="lightbg">Music: "Whisper" by "Burn The Ballroom"</p>
    <section class="lightbg">
      <a href="../index.html">Back to main page.</a>
    </section>
    <section class="lightbg" style="background-color: #c7a3f5cc;">
      <h4>Heres my partner's name in images</h4>
        <img src="Media/Light_A.JPG" alt="A" class="photo" style="width: 32%; height: 32%;">
        <img src="Media/Light_T.JPG" alt="T" class="photo" style="width: 32%; height: 32%;">
        <img src="Media/Light_L.JPG" alt="L" class="photo" style="width: 32%; height: 32%;">
        <img src="Media/Light_A2.JPG" alt="A" class="photo" style="width: 32%; height: 32%;">
        <img src="Media/Light_S.JPG" alt="S" class="photo" style="width: 32%; height: 32%;">
        <img src="../images/CameraPhotos/DSCF9825.JPG" alt="&lt;3" class="photo" style="width: 32%; height: 32%;">
        <p>My partner's name is Atlas, and I love them to death for that can be.</p>
    </section>
    <section class="lightbg" style="background-color: #c7a3f5cc;">
        <img src="Media/Sera_EYES.png" alt="&#128064;" class="photo" style="width: 50%; height: 50%;">
    </section>
  </main>
  <script src="../index.js" defer></script>
</body>
</html>
